<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    Wird beim Bauen durch --base-href ersetzt (im Deploy-Skript "/repforge/").
    Muss mit Schraegstrich beginnen und enden, sonst laedt auf GitHub Pages
    keine einzige Datei.
  -->
  <base href="/repforge/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RepForge - Trainingstagebuch von HWG.Tech: Plaene, Logging, Verlauf und Auswertung.">
  <meta name="theme-color" content="#18AA4C">

  <!--
    Der Streifen hinter Uhr und Akku gehoert NICHT zur Flutter-Flaeche: Auf
    dem iPhone liegt die Statusleiste ausserhalb des Ansichtsfensters, und
    iOS fuellt sie mit der Hintergrundfarbe der SEITE. Ohne diese Regeln
    bleibt dort das Weiss des Browsers stehen, waehrend darunter die dunkle
    App beginnt - eine weisse Kante ueber der Ueberschrift.

    Die zwei Farben sind der Grundton aus lib/ui/gestaltung.dart und muessen
    mit "helleGestaltung" und "dunkleGestaltung" gleich bleiben. Sie greifen
    beim Laden und bei der Systemeinstellung; sobald die App laeuft, setzt
    sie die Farbe passend zur eigenen Wahl nach (lib/logic/seitenfarbe.dart).
  -->
  <style>
    html, body { margin: 0; padding: 0; background-color: #F1F4F1; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0C0F0D; }
    }
  </style>

  <!--
    iPhone: Diese Angaben entscheiden, wie die App aussieht, wenn sie ueber
    "Zum Home-Bildschirm" installiert wird - der Titel steht dann unter dem
    Symbol.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RepForge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    Ein Symbol fuer alle Faelle, bewusst ohne Umschaltung nach Hell/Dunkel.
    Die Kachel bringt ihren dunklen Grund selbst mit - genau wie das Symbol
    am Home-Bildschirm und das Logo im Sperr-Bildschirm. Ein Tab-Symbol, das
    je nach Systemmodus anders aussieht, waere die einzige Stelle, an der die
    Marke wechselt.

    Am Home-Bildschirm ginge eine Umschaltung ohnehin nicht: Das Symbol wird
    beim Hinzufuegen einmal eingebacken und danach nie wieder nachgeladen.
  -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RepForge</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
