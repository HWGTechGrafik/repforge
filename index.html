<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    Wird beim Bauen durch --base-href ersetzt (im Deploy-Skript "/RepForge/").
    Muss mit Schraegstrich beginnen und enden, sonst laedt auf GitHub Pages
    keine einzige Datei.
  -->
  <base href="/repforge/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RepForge - Trainingstagebuch von HWG.Tech: Plaene, Logging, Verlauf und Auswertung.">
  <meta name="theme-color" content="#18AA4C">

  <!--
    iPhone: Diese Angaben entscheiden, wie die App aussieht, wenn sie ueber
    "Zum Home-Bildschirm" installiert wird - der Titel steht dann unter dem
    Symbol. Die Statusleiste bleibt durchscheinend, damit der eigene
    Hintergrund bis unter die Uhr laeuft.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RepForge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RepForge</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
